name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Validate release tag
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "release tag must be vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          version="${BASH_REMATCH[1]}"
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          grep -Fqx "const Version = \"${version}\"" internal/buildinfo/buildinfo.go
      - name: Verify Go toolchain
        shell: bash
        run: |
          go version
          go version | grep -Eq 'go1\.26([.[:space:]])'
      - name: Verify
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test ./...
      - name: Build Apple Silicon release
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist/stage
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags='-s -w' -o dist/stage/surfy ./cmd/surfy
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner -C dist/stage -cf - surfy | gzip -n > "dist/surfy_${version}_darwin_arm64.tar.gz"
          sha256sum "dist/surfy_${version}_darwin_arm64.tar.gz" > "dist/surfy_${version}_darwin_arm64.tar.gz.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-assets
          path: dist/surfy_*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: main
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-assets
          path: dist
      - name: Validate version progression
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          current="$(sed -nE 's/^  version "([^"]+)"/\1/p' Formula/surfy.rb)"
          if [[ "$(printf '%s\n%s\n' "$current" "$version" | sort -V | tail -n 1)" != "$version" ]]; then
            echo "release version ${version} must not be older than formula version ${current}" >&2
            exit 1
          fi
          if [[ "$version" == "$current" ]] && ! grep -Fq 'sha256 :no_check' Formula/surfy.rb; then
            echo "release version ${version} is already published in the formula" >&2
            exit 1
          fi
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          assets=(
            "dist/surfy_${version}_darwin_arm64.tar.gz"
            "dist/surfy_${version}_darwin_arm64.tar.gz.sha256"
          )
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
              --title "Surfy $GITHUB_REF_NAME" --generate-notes
          fi
      - name: Update Homebrew formula on main
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          asset="dist/surfy_${version}_darwin_arm64.tar.gz"
          sha="$(sha256sum "$asset" | cut -d ' ' -f 1)"
          sed -i -E "s/version \"[^\"]+\"/version \"${version}\"/" Formula/surfy.rb
          sed -i -E "s#url \"[^\"]+\"#url \"https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/surfy_${version}_darwin_arm64.tar.gz\"#" Formula/surfy.rb
          sed -i -E "s/sha256 .*/sha256 \"${sha}\"/" Formula/surfy.rb
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Formula/surfy.rb
          git diff --cached --quiet || git commit -m "chore(homebrew): update formula for ${GITHUB_REF_NAME} [skip ci]"
          git push origin main
