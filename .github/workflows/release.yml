name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  prepare:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      sha: ${{ steps.release.outputs.sha }}
      should_release: ${{ steps.release.outputs.should_release }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - id: release
        name: Prepare release
        shell: bash
        env:
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          version="$(sed -nE 's/^const Version = "([^"]+)"/\1/p' internal/buildinfo/buildinfo.go)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "build version must be MAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          grep -Fqx "VERSION ?= ${version}" Makefile
          grep -Fqx "  version \"${version}\"" Formula/surfy.rb
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"
          echo "sha=${RELEASE_SHA}" >> "$GITHUB_OUTPUT"
          if grep -Fq 'sha256 :no_check' Formula/surfy.rb; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - name: Verify Go toolchain
        shell: bash
        run: |
          go version
          go version | grep -Eq 'go1\.26([.[:space:]])'
      - name: Verify
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test ./...
      - name: Build Apple Silicon release
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          mkdir -p dist/stage
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags='-s -w' -o dist/stage/surfy ./cmd/surfy
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner -C dist/stage -cf - surfy | gzip -n > "dist/surfy_${VERSION}_darwin_arm64.tar.gz"
          sha256sum "dist/surfy_${VERSION}_darwin_arm64.tar.gz" > "dist/surfy_${VERSION}_darwin_arm64.tar.gz.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-assets
          path: dist/surfy_*
          if-no-files-found: error

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: main
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-assets
          path: dist
      - name: Verify main has not advanced
        env:
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
        run: test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
        shell: bash
        run: |
          assets=(
            "dist/surfy_${VERSION}_darwin_arm64.tar.gz"
            "dist/surfy_${VERSION}_darwin_arm64.tar.gz.sha256"
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --clobber
          else
            gh release create "$TAG" "${assets[@]}" \
              --target "$RELEASE_SHA" --title "Surfy $TAG" --generate-notes
          fi
      - name: Update Homebrew formula on main
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          asset="dist/surfy_${VERSION}_darwin_arm64.tar.gz"
          sha="$(sha256sum "$asset" | cut -d ' ' -f 1)"
          sed -i -E "s#url \"[^\"]+\"#url \"https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/surfy_${VERSION}_darwin_arm64.tar.gz\"#" Formula/surfy.rb
          sed -i -E "s/sha256 .*/sha256 \"${sha}\"/" Formula/surfy.rb
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Formula/surfy.rb
          git diff --cached --quiet || git commit -m "chore(homebrew): publish ${TAG} checksum [skip ci]"
          git push origin main
