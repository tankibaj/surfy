name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: true
      - name: Formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Cross-build native Apple Silicon binary
        env:
          CGO_ENABLED: '0'
          GOOS: darwin
          GOARCH: arm64
        run: go build -trimpath -ldflags='-s -w' -o serve-them-darwin-arm64 ./cmd/serve-them
      - uses: actions/upload-artifact@v4
        with:
          name: serve-them-darwin-arm64
          path: serve-them-darwin-arm64
          if-no-files-found: error
